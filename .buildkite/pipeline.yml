steps:
  - label: ":buildkite:"
    key: init
    command: "echo Hi there"

  - label: ":linux: registry/base:latest"
    key: registry
    depends_on: init
    image: "${BUILDKITE_HOSTED_REGISTRY_URL}/base:latest"
    command: |
      echo "Hello, world!"
      uname -a

  - label: ":linux: ubuntu:26.04"
    key: ubuntu
    depends_on: init
    image: "ubuntu:26.04"
    command: |
      echo "Hello, world!"
      uname -a

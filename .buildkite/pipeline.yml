agents:
  queue: "default"

image: "${BUILDKITE_HOSTED_REGISTRY_URL}/base:latest"

steps:
  - label: ":docker: image build"
    key: build
    image: ~
    if_changed:
      - ".buildkite/pipeline.yml"
      - ".buildkite/Dockerfile.build"
    command: |
      uname -a
      echo "$${AL_OS:-unfound}"
      docker buildx build \
        --file .buildkite/Dockerfile.build \
        --build-arg BUILDKITE_BUILD_NUMBER="$$BUILDKITE_BUILD_NUMBER" \
        --platform linux/amd64 \
        --tag "${BUILDKITE_HOSTED_REGISTRY_URL}/base:latest" \
        --progress plain \
        --push .

  - label: ":docker: image build alt"
    key: build_alt
    image: ~
    if_changed:
      - ".buildkite/pipeline.yml"
      - ".buildkite/Dockerfile.alt"
    command: |
      uname -a
      echo "$${AL_OS:-unfound}"
      docker buildx build \
        --file .buildkite/Dockerfile.alt \
        --build-arg BUILDKITE_BUILD_NUMBER="$$BUILDKITE_BUILD_NUMBER" \
        --platform linux/amd64 \
        --tag "${BUILDKITE_HOSTED_REGISTRY_URL}/base:alternate" \
        --progress plain \
        --push .

  - label: ":pipeline: with"
    depends_on: build
    key: run
    image: "${BUILDKITE_HOSTED_REGISTRY_URL}/base:latest"
    command: |
      echo "Running in the job now..."
      buildkite-agent --version
      uname -a
      echo "$$AL_OS"

  - label: ":pipeline: with alt"
    depends_on: build_alt
    key: run_alt
    image: "${BUILDKITE_HOSTED_REGISTRY_URL}/base:alternate"
    command: |
      echo "Running in the job now..."
      buildkite-agent --version
      uname -a
      echo "$$AL_OS"

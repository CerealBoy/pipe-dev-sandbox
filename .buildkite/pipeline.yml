steps:
  - label: ":buildkite:"
    env:
      EXTRA_BIT: "volume;hello=world"
    key: init
    command: |
      ls -la
      ls -la .cache || true
      mkdir -p .cache
      ls -la .cache || true
      ls -la
    cache:
      paths:
        - ".cache"
      size: 20g
      name: "testing-${EXTRA_BIT}"

steps:
  - label: "Artifact MIME type bug test"
    commands: |
      echo 'UTF-8 café, naïve, 日本語' > file-no-content-type.log
      echo 'UTF-8 café, naïve, 日本語' > file-content-type-set.log
      echo "Uploading file-no-content-type.log without --content-type"
      buildkite-agent artifact upload file-no-content-type.log
      echo "Uploading file-content-type-set.log with --content-type 'text/plain;charset=utf-8'"
      buildkite-agent artifact upload file-content-type-set.log --content-type "text/plain;charset=utf-8"
